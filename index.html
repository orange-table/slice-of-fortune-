<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive digital fortune cookie experience.">
  <title>Fortune Cookie | Digital Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FFF01F;
      --text-main: #1a0a00;
      --text-muted: #6b4400;
      --font-fancy: 'Reenie Beanie', cursive;
      --font-body: Georgia, 'Times New Roman', serif;
      --transition-standard: 0.25s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-fancy);
      overflow: hidden;
      transition: background-color 0.8s ease;
    }

    /* Screen reader only header */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: -10vh;
      width: 100%;
    }

    .cookie-stage {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cookie-shadow {
      position: absolute;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 34px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.28) 0%, transparent 72%);
      border-radius: 50%;
      transition: width 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }
    .cookie-shadow.open { width: 540px; }

    @keyframes idle-wobble {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.012) rotate(-1.2deg) translate(-2px, 1px); }
      40% { transform: scale(1.015) rotate(1deg) translate(2px, -2px); }
      80% { transform: scale(1.013) rotate(1.2deg) translate(1px, -1px); }
    }

    #cookie-closed {
      position: absolute;
      width: 560px;
      height: 560px;
      object-fit: contain;
      z-index: 2;
      cursor: pointer;
      animation: idle-wobble 2.8s ease-in-out infinite;
      transition: opacity var(--transition-standard), transform var(--transition-standard);
      transform-origin: center center;
      -webkit-user-drag: none;
    }

    #cookie-open {
      position: absolute;
      width: 320px;
      height: 320px;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
      transform: scale(0.65);
      opacity: 0;
    }

    .fortune-slip {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-56%, -50%);
      width: 170px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.4s ease 0.45s;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    .fortune-slip.visible { opacity: 1; }
    .fortune-slip.fast-hide {
      transition: opacity 0.1s ease 0s !important;
      opacity: 0 !important;
    }

    .fortune-text {
      text-align: center;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-style: italic;
      color: var(--text-main);
      line-height: 1.4;
      width: 100%;
    }
    .fortune-tag {
      font-family: var(--font-body);
      font-size: 0.56rem;
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      width: 100%;
      white-space: nowrap;
    }

    #try-btn {
      font-family: var(--font-fancy);
      font-size: 2.2rem;
      color: var(--text-muted);
      background: none;
      border: none;
      line-height: 1;
      margin-top: -20px;
      letter-spacing: 0.02em;
      opacity: 0;
      visibility: hidden;
      cursor: default;
      pointer-events: none;
      transform: scale(1);
      transition: opacity var(--transition-standard), transform 0.15s ease;
      outline-offset: 8px;
    }
    #try-btn.visible {
      opacity: 1;
      visibility: visible;
      cursor: pointer;
      pointer-events: auto;
    }
    #try-btn.visible:hover { transform: scale(1.05); }

    /* ── Mobile Optimization ── */
@media (max-width: 768px) {
  body {
    /* Ensure the body takes up exactly the visible screen height */
    height: 100svh; 
    padding: 40px 0; /* Vertical padding for breathing room */
  }

  #app {
    margin-top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    /* This pushes the cookie to the center and the button to the bottom */
    justify-content: space-between; 
    align-items: center;
  }

  #cookie-container {
    width: 100vw;
    height: 60vw;
    /* Keeps the cookie visually centered in the upper portion */
    margin-top: auto;
    margin-bottom: auto; 
  }

  /* Shadow and Image scaling */
  #cookie-shadow { width: 38vw; height: 4vw; bottom: 4vw; }
  #cookie-shadow.open { width: 70vw; }
  #cookie-closed { width: 200vw; height: 200vw; }
  #cookie-open   { width: 88vw; height: 88vw; }

  /* Fortune Paper scaling */
  #paper-slip {
    top: 50%;
    left: 50%;
    transform: translate(-56%, -50%);
    width: 42vw;
    height: 18vw;
    gap: 2px;
  }

  #fortune-text { font-size: clamp(9px, 2.4vw, 14px); line-height: 1.3; }
  #attribution  { font-size: clamp(8px, 1.8vw, 11px); }

  /* ── Positioned Button ── */
  #try-btn {
    font-size: clamp(1.8rem, 8vw, 2.5rem);
    margin-top: 0;
    margin-bottom: 20px; /* Distance from the very bottom of the screen */
    padding: 10px 20px;
    transition: opacity 0.3s ease, transform 0.2s ease;
  }
}

/* Extra small screens / Short phones */
@media (max-height: 600px) and (max-width: 480px) {
  #cookie-container { transform: scale(0.9); }
  #try-btn { margin-bottom: 10px; font-size: 1.6rem; }
}
  </style>
</head>
<body>

  <h1 class="sr-only">Interactive Fortune Cookie</h1>

  <main id="app">
    <section class="cookie-stage" aria-label="Fortune Cookie Interaction Area">
      <div class="cookie-shadow" id="cookie-shadow"></div>
      
      <img id="cookie-closed" 
           src="close_2.png" 
           alt="A closed fortune cookie. Click to crack it open."
           role="button" 
           tabindex="0"
           fetchpriority="high"
           loading="eager">

      <img id="cookie-open" 
           src="open_2.png" 
           alt="An opened fortune cookie."
           loading="eager">

      <div class="fortune-slip" id="paper-slip" aria-live="polite">
        <p class="fortune-text" id="fortune-text"></p>
        <p class="fortune-tag" id="attribution"></p>
      </div>
    </section>

    <button id="try-btn" aria-label="Get another fortune" disabled>try another</button>
  </main>

  <script>
    (function() {
      "use strict";

      // ── State Management ──
      const State = {
        isOpen: false,
        isAnimating: false,
        usedIndices: [],
        audioContext: null
      };

      const DOM = {
        closedImg: document.getElementById('cookie-closed'),
        openImg: document.getElementById('cookie-open'),
        shadow: document.getElementById('cookie-shadow'),
        paperSlip: document.getElementById('paper-slip'),
        fortuneText: document.getElementById('fortune-text'),
        attribution: document.getElementById('attribution'),
        tryBtn: document.getElementById('try-btn')
      };

      // ── Audio Engine ──
      const getCtx = () => {
        if (!State.audioContext) {
          State.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (State.audioContext.state === 'suspended') State.audioContext.resume();
        return State.audioContext;
      };

      const playCrack = () => {
        const c = getCtx();
        const n = Math.floor(c.sampleRate * 0.18), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
        for(let i=0; i<n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.5);
        const src = c.createBufferSource(); src.buffer = b;
        const bpf = c.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 1800;
        const g = c.createGain(); g.gain.setValueAtTime(1.4, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
        src.connect(bpf); bpf.connect(g); g.connect(c.destination); src.start();
      };

      const playChimes = () => {
        const c = getCtx();
        [523.25, 659.25, 783.99, 987.77].forEach((freq, i) => {
          const o = c.createOscillator();
          const env = c.createGain(), t = c.currentTime + i * 0.14;
          o.frequency.value = freq;
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(0.15, t + 0.01);
          env.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
          o.connect(env); env.connect(c.destination);
          o.start(t); o.stop(t + 1.2);
        });
      };

      const playSwoosh = (isRising) => {
        const c = getCtx();
        const o = c.createOscillator();
        const g = c.createGain();
        o.frequency.setValueAtTime(isRising ? 200 : 800, c.currentTime);
        o.frequency.exponentialRampToValueAtTime(isRising ? 800 : 200, c.currentTime + 0.2);
        g.gain.setValueAtTime(0.1, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.2);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + 0.2);
      };

      // ── Logic ──
      const fortunes = [
  {text:"You will die someday. But today the coffee is hot and the Wi-Fi works.",tag:"Monday wisdom"},
  {text:"Your body is 60% water. Stay hydrated.",tag:"health tip"},
  {text:"Everything ends. But right now there's still leftovers in the fridge.",tag:"silver lining"},
  {text:"You'll be forgotten in 200 years. Today someone react to your post.",tag:"the good news"},
  {text:"Time is an illusion. Lunch, however, is very real and very close.",tag:"philosophy"},
  {text:"You've survived 100% of your worst days so far. Statistically impressive.",tag:"encouragement"},
  {text:"The void stares back. It has never once judged your screen time.",tag:"comfort"},
  {text:"At some point your heart will stop. Until then, keep sending memes.",tag:"priorities"},
  {text:"Nothing truly matters. Your bad haircut doesn't either. You're free.",tag:"liberation"},
  {text:"You are a ghost driving a skeleton made of stardust. Don't take it so seriously.",tag:"cosmic truth"},
  {text:"The meeting that could have been an email will one day be a memory.",tag:"patience"},
  {text:"You are a brief flicker in the universe. Make it a warm one.",tag:"gentle reminder"},
  {text:"Entropy claims everything. Your dog, however, still loves you right now.",tag:"focus on now"},
  {text:"Reality is crumbling. But your plants grew a new leaf this week.",tag:"small victories"},
  {text:"You are not behind in life. There is no schedule. There is only nap.",tag:"relief"},
  {text:"Nobody really knows what they're doing. Some just iron their shirts first.",tag:"secret"},
  {text:"The sun will swallow the earth. Today it's warming your window seat.",tag:"astronomy"},
  {text:"You are 1 of 8 billion. Yet you're exactly who someone texted first.",tag:"you specifically"},
  {text:"Despair is temporary. So is bad traffic. Keep driving.",tag:"motion"},
  {text:"Some days the best thing you did was exist. That still counts.",tag:"bare minimum, honored"},
  {text:"Nothing is permanent. Including the laundry pile. Eventually.",tag:"faith"},
  {text:"Chaos is the default. You've been navigating without a manual.",tag:"performance review"},
  {text:"Life is a simulation. If you're glitching today, just call it a 'feature.'",tag:"tech support"},
  {text:"You will send an email with a typo in it. The company will survive.",tag:"work"},
  {text:"You've survived every Monday so far. This one is no different.",tag:"Mondays"},
  {text:"That project everyone forgot about? You finished it anyway. That's character.",tag:"diligence"},
  {text:"What's to be, will be. Keep trying",tag:"hope"},
  {text:"You did not become a morning person. But you became someone who shows up.",tag:"commitment"},
  {text:"Your resignation letter is a masterpiece you may never send. Keep it updated anyway.",tag:"options"},
  {text:"The grind is real. So is Saturday. Hold on.",tag:"weekend"},
  {text:"Love is irrational. So is getting out of bed. You do both. You're doing great.",tag:"love"},
  {text:"They didn't text back. The universe did not collapse. You are still worthy of reply.",tag:"texting"},
  {text:"Every long relationship survives at least one IKEA visit. That's the real vow.",tag:"commitment"},
  {text:"You will be misunderstood by someone you love. Say it again, more slowly.",tag:"communication"},
  {text:"Asides from keep trying and keep going, what else can we do as a human?",tag:"solitude"},
  {text:"Heartbreak is survivable. A billion people have proved it before you.",tag:"breakups"},
  {text:"They left. You remained. You are the constant in this story.",tag:"self"},
  {text:"Some people leave and it makes room for the ones who actually stay.",tag:"perspective"},
  {text:"Your ex is doing fine. So are you. This has nothing to do with each other.",tag:"moving on"},
  {text:"You don't need to be fixed before being loved. You just need $5Mio.",tag:"self-worth"},
  {text:"Rest is not quitting. Your body is rebuilding right now.",tag:"recovery"},
  {text:"Keep some room in your heart for the unimaginable - Mary Oliver.",tag:"spectacle"},
  {text:"You ran on a day you didn't want to. That's the one that counts most.",tag:"running"},
  {text:"It always work out, life somehow works out, regardless.",tag:"life"},
  {text:"Try not to waste life worrying about the future, we here right now, that's all we know.",tag:"present"},
  {text:"You can't add any days to your life by worrying.",tag:"worrying"},
  {text:"The injury is frustrating. The comeback will be worth writing about.",tag:"injury"},
  {text:"You skipped the gym again. You also went back again. The second one matters more.",tag:"consistency"},
  {text:"The trophy collects dust. The discipline you built to win it goes everywhere with you.",tag:"legacy"},
  {text:"Saving a little beats saving nothing. The gap between the two is your whole future.",tag:"saving"},
  {text:"You bought the thing. It brought you joy. - Fin. ",tag:"spending"},
  {text:"Make the most of every stage, the good or the bad. It's what makes rainbows.",tag:"all outs"},
  {text:"Markets go down. They have always come back. So will you.",tag:"investing"},
  {text:"You cannot afford everything. You can afford something. Today that is enough.",tag:"enough"},
  {text:"Wealthy people also lie awake at 3am worrying. Just with better pillows.",tag:"wealth"},
  {text:"The raise will come late. Like all good things, it will feel long overdue.",tag:"patience"},
  {text:"Debt is a chapter, not the whole book. You are still the author.",tag:"debt"},
  {text:"Every money mistake is tuition. You are earning an expensive degree in real life.",tag:"lessons"},
  {text:"Your phone knows your habits better than your friends do. Maybe introduce them.",tag:"technology"},
  {text:"The app crashed at the worst time. Technology is humbling. So is life. You recovered.",tag:"tech life"},
  {text:"Social media shows you the highlight reel. Your behind-the-scenes is still valid content.",tag:"social media"},
  {text:"Everything will be alright in the end, if it's not alright, it's not the end.",tag:"optimism"},
  {text:"Your idea is not too late. The internet is still young enough to make room.",tag:"opportunity"},
  {text:"Screens are not the enemy. Forgetting there's a world behind them is.",tag:"balance"},
  {text:"You googled something embarrassing. The search bar is the most honest place on earth.",tag:"internet"},
  {text:"Time is a flat circle. Fortunately, so is a donut. Focus on the donut.",tag:"geometry"},
  {text:"You will forget most of this year. You will remember the moments that mattered. That's enough.",tag:"memory"},
  {text:"The trip you keep postponing still exists. So does your passport.",tag:"travel"},
  {text:"The hobby you abandoned is waiting patiently. It has nowhere else to be.",tag:"hobbies"},
  {text:"Sleep is the most radical act of optimism. You believe tomorrow is worth showing up for.",tag:"rest"},
  {text:"You are older than you've ever been. Still younger than you're going to be.",tag:"time"},
  {text:"The dream felt impossible until someone did it. Now it's just a career path.",tag:"ambition"},
  {text:"Your comfort zone is not the enemy. It's base camp. Rest there. Then go (if you want to).",tag:"courage"},
  {text:"The bad day ended. Every single bad day has, so far. Perfect record.",tag:"endurance"},
  {text:"One day, you'll be the 'mysterious ancestor' in a photo. Look cool.",tag:"genealogy"},
  {text:"If nothing matters, then being happy for no reason is a valid strategy.",tag:"logic"},
        
      ];

      const getRandomFortune = () => {
        if (State.usedIndices.length === fortunes.length) State.usedIndices = [];
        let idx;
        do { idx = Math.floor(Math.random() * fortunes.length); } 
        while (State.usedIndices.includes(idx));
        State.usedIndices.push(idx);
        return fortunes[idx];
      };

      const crack = () => {
        if (State.isOpen || State.isAnimating) return;
        State.isAnimating = true;

        playCrack();
        const fortune = getRandomFortune();
        DOM.fortuneText.textContent = fortune.text;
        DOM.attribution.textContent = `✦ ${fortune.tag} ✦`;

        DOM.closedImg.style.animation = 'none';
        DOM.closedImg.style.transform = 'scale(1.8)';
        DOM.closedImg.style.opacity = '0';
        DOM.closedImg.style.pointerEvents = 'none';

        DOM.openImg.style.transform = 'scale(2)';
        DOM.openImg.style.opacity = '1';
        DOM.shadow.classList.add('open');

        DOM.paperSlip.classList.remove('fast-hide');
        setTimeout(playChimes, 420);

        setTimeout(() => {
          DOM.paperSlip.classList.add('visible');
          DOM.tryBtn.disabled = false;
          DOM.tryBtn.classList.add('visible');
          State.isOpen = true;
          State.isAnimating = false;
        }, 600);
      };

      const reset = () => {
        if (!State.isOpen || State.isAnimating) return;
        State.isAnimating = true;

        DOM.tryBtn.disabled = true;
        DOM.tryBtn.classList.remove('visible');
        DOM.paperSlip.classList.add('fast-hide');
        DOM.paperSlip.classList.remove('visible');

        setTimeout(() => {
          DOM.openImg.style.transform = 'scale(0.65)';
          DOM.openImg.style.opacity = '0';
          DOM.shadow.classList.remove('open');

          setTimeout(() => {
            DOM.closedImg.style.transform = '';
            DOM.closedImg.style.opacity = '1';
            DOM.closedImg.style.animation = '';
            DOM.closedImg.style.pointerEvents = 'auto';
            State.isOpen = false;
            State.isAnimating = false;
          }, 320);
        }, 110);
      };

      // ── Event Listeners ──
      DOM.closedImg.addEventListener('click', crack);
      DOM.closedImg.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') crack(); });
      DOM.tryBtn.addEventListener('click', reset);
      
      DOM.closedImg.addEventListener('mouseenter', () => !State.isOpen && playSwoosh(true));
      DOM.tryBtn.addEventListener('mouseenter', () => !DOM.tryBtn.disabled && playSwoosh(false));

    })();

    
  </script>
</body>
</html>
